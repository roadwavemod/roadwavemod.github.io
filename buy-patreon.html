<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taking you to Patreon — Roadwave Advanced</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f13;color:#e8edf3;
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center}
.box{padding:30px}
h1{font-size:22px;margin:0 0 10px}
p{color:#9aa6b4;margin:0 0 18px}
a{color:#2fd07a}
.btn{display:inline-block;background:#2fd07a;color:#06170e;font-weight:700;text-decoration:none;
 padding:12px 24px;border-radius:8px}
</style>
<script>
// A page of its own, not buy.html?store=patreon, because Cloudflare Web
// Analytics records the PATH and never the query string. As one page with a
// parameter, both stores counted as a single /buy.html view and there was no
// way to see which one anybody chose. Same reason the ?from= channel tags
// were dropped on 14.9.2026, applied to the thing they were dropped over.
(function(){
  var PATREON="https://www.patreon.com/c/villahousu/shop";
  setTimeout(function(){ location.replace(PATREON); }, 1500);
})();
</script>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5e77c90837694a70bf4bd2a74857b9de"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>
<div class="box">
  <h1>Taking you to Patreon…</h1>
  <p>One moment. If nothing happens, use the button.</p>
  <a class="btn" href="https://www.patreon.com/c/villahousu/shop">Continue to Patreon</a>
</div>
</body>
</html>
