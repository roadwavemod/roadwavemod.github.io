<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taking you to the store — Roadwave Advanced</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f13;color:#e8edf3;
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center}
.box{padding:30px}
h1{font-size:22px;margin:0 0 10px}
p{color:#9aa6b4;margin:0 0 18px}
a{color:#2fd07a}
.btn{display:inline-block;background:#2fd07a;color:#06170e;font-weight:700;text-decoration:none;
 padding:12px 24px;border-radius:8px}
</style>
<script>
// One redirect page per store, so a plain page-view counter measures buy-button clicks.
(function(){
  var KOFI="https://ko-fi.com/s/d53c388128";
  var PATREON="https://www.patreon.com/c/villahousu/shop";
  var store=new URLSearchParams(location.search).get("store");
  var target=(store==="patreon")?PATREON:KOFI;
  document.addEventListener("DOMContentLoaded",function(){
    var a=document.getElementById("manual"); a.href=target;
  });
  setTimeout(function(){ location.replace(target); }, 900);
})();
</script>
</head>
<body>
<div class="box">
  <h1>Taking you to the store…</h1>
  <p>One moment. If nothing happens, use the button.</p>
  <a class="btn" id="manual" href="https://ko-fi.com/s/d53c388128">Continue to the store</a>
</div>
</body>
</html>
